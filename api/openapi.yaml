openapi: 3.1.0
info:
  title: 3D Quality Check API
  description: Creates and retrieves STL and 3MF quality-check jobs, including safe STL cleanup jobs.
  version: 0.1.0
servers:
  - url: /api/v1
paths:
  /health:
    get:
      summary: Check API health
      operationId: getHealth
      responses:
        "200":
          description: The API is healthy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: ok
  /jobs:
    post:
      summary: Create an STL or 3MF processing job
      operationId: createJob
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateJobRequest"
            example:
              fileName: rotor.stl
              fileSizeBytes: 117884
      responses:
        "201":
          description: The job was created and an upload URL was generated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateJobResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "413":
          description: The declared file size exceeds the 25 MiB upload limit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodedErrorResponse"
        "429":
          description: The anonymous free upload limit has been reached.
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodedErrorResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /jobs/{id}:
    get:
      summary: Retrieve a job
      operationId: getJob
      parameters:
        - name: id
          in: path
          required: true
          description: Job ID returned when the job was created.
          schema:
            type: string
      responses:
        "200":
          description: The requested job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "404":
          description: The job does not exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: job not found
        "500":
          $ref: "#/components/responses/InternalServerError"
  /jobs/{id}/cleaned-stl:
    get:
      summary: Download a verified cleaned STL from a safe repair job
      operationId: downloadCleanedStl
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "302":
          description: Redirect to a short-lived private artifact download.
        "404":
          description: No cleaned artifact is available for this job.
components:
  schemas:
    HealthResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
    CreateJobRequest:
      type: object
      additionalProperties: false
      required:
        - fileName
        - fileSizeBytes
      properties:
        fileName:
          type: string
          pattern: "\\.([sS][tT][lL]|[3][mM][fF])$"
          example: rotor.stl
        fileSizeBytes:
          type: integer
          format: int64
          minimum: 1
          maximum: 26214400
          example: 117884
        operation:
          type: string
          enum: [safe_stl_repair]
          description: Optional explicit safe cleanup operation. Omit for a normal quality check.
    Job:
      type: object
      required:
        - id
        - fileName
        - fileSizeBytes
        - status
        - createdAt
      properties:
        id:
          type: string
          example: 1138660d531841f094944f9753b95a3a
        fileName:
          type: string
          example: rotor.stl
        fileSizeBytes:
          type: integer
          format: int64
          example: 117884
        fileFormat:
          type: string
          enum: [stl, 3mf]
          description: Trusted server-side format selected by the job endpoint.
        operation:
          type: string
          enum: [quality_check, safe_stl_repair]
        status:
          type: string
          enum:
            - created
            - processing
            - completed
            - failed
        createdAt:
          type: string
          format: date-time
        report:
          type: object
          description: Present when status is completed.
          additionalProperties: true
        failure:
          type: object
          description: Present when status is failed.
          additionalProperties: true
    CreateJobResponse:
      allOf:
        - $ref: "#/components/schemas/Job"
        - type: object
          required:
            - upload
          properties:
            upload:
              $ref: "#/components/schemas/Upload"
    Upload:
      type: object
      required:
        - url
        - method
        - fields
        - expiresAt
      properties:
        url:
          type: string
          format: uri
          description: Presigned S3 form action for uploading the STL file.
        method:
          type: string
          enum:
            - POST
        fields:
          type: object
          description: Fields that must be included before the file in the multipart form data.
          additionalProperties:
            type: string
        expiresAt:
          type: string
          format: date-time
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
    CodedErrorResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          enum: [FILE_TOO_LARGE, RATE_LIMITED, RATE_LIMIT_UNAVAILABLE]
        message:
          type: string
        retryAfterSeconds:
          type: integer
          minimum: 1
  responses:
    BadRequest:
      description: The request is invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalServerError:
      description: An unexpected error occurred.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
