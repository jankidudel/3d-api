openapi: 3.1.0
info:
  title: 3D Quality Check API
  description: Creates and retrieves STL and 3MF quality-check jobs, including safe STL cleanup jobs.
  version: 0.1.0
servers:
  - url: /api/v1
paths:
  /health:
    get:
      summary: Check API health
      operationId: getHealth
      responses:
        "200":
          description: The API is healthy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: ok
  /jobs:
    post:
      summary: Create an STL or 3MF processing job
      operationId: createJob
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateJobRequest"
            example:
              fileName: rotor.stl
              fileSizeBytes: 117884
      responses:
        "201":
          description: The job was created and an upload URL was generated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateJobResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "413":
          description: The declared file size exceeds the 25 MiB upload limit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodedErrorResponse"
        "429":
          description: The anonymous free upload limit has been reached.
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodedErrorResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /contact:
    post:
      summary: Send a verified contact or feedback message
      operationId: createContactMessage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactMessageRequest"
      responses:
        "202":
          description: The message was accepted for delivery.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactMessageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          description: The per-visitor or global daily contact-delivery limit has been reached.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Contact delivery or CAPTCHA verification is temporarily unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /subscriptions:
    post:
      summary: Subscribe an email address to InspectMesh updates
      operationId: createSubscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscriptionRequest"
      responses:
        "202":
          description: The subscription was accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: The email address is already subscribed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: The per-visitor or global subscription daily limit has been reached.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Subscription delivery or CAPTCHA verification is temporarily unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /jobs/{id}:
    get:
      summary: Retrieve a job
      operationId: getJob
      parameters:
        - name: id
          in: path
          required: true
          description: Job ID returned when the job was created.
          schema:
            type: string
      responses:
        "200":
          description: The requested job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "404":
          description: The job does not exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: job not found
        "500":
          $ref: "#/components/responses/InternalServerError"
  /jobs/{id}/complete:
    post:
      summary: Verify an uploaded file and queue it for processing
      operationId: completeJobUpload
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "202":
          description: The uploaded file passed quota checks and was queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "413":
          description: The actual S3 object exceeds the upload limit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodedErrorResponse"
        "429":
          description: The rolling upload allowance has been reached.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodedErrorResponse"
  /jobs/{id}/cleaned-stl:
    get:
      summary: Download a verified cleaned STL from a safe repair job
      operationId: downloadCleanedStl
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "302":
          description: Redirect to a short-lived private artifact download.
        "404":
          description: No cleaned artifact is available for this job.
  /jobs/{id}/cleaned-3mf:
    get:
      summary: Download a verified repaired 3MF from a safe repair job
      operationId: downloadCleanedThreeMf
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "302":
          description: Redirect to a short-lived private artifact download.
        "404":
          description: No repaired artifact is available for this job.
components:
  schemas:
    HealthResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
    CreateJobRequest:
      type: object
      additionalProperties: false
      required:
        - fileName
        - fileSizeBytes
      properties:
        fileName:
          type: string
          pattern: "\\.([sS][tT][lL]|[3][mM][fF])$"
          example: rotor.stl
        fileSizeBytes:
          type: integer
          format: int64
          minimum: 1
          maximum: 26214400
          example: 117884
        operation:
          type: string
          enum: [safe_stl_repair, safe_3mf_repair]
          description: Optional explicit safe cleanup operation. Omit for a normal quality check.
    ContactMessageRequest:
      type: object
      additionalProperties: false
      required: [reason, email, message, turnstileToken]
      properties:
        reason:
          type: string
          enum:
            - Report a problem
            - Request a tool or feature
            - General question
            - Partnership or business enquiry
        name:
          type: string
          maxLength: 120
        email:
          type: string
          format: email
          maxLength: 254
        message:
          type: string
          minLength: 1
          maxLength: 5000
        context:
          type: string
          maxLength: 240
        website:
          type: string
          description: Hidden honeypot field. It must be left blank.
        turnstileToken:
          type: string
          description: Cloudflare Turnstile token verified server-side.
    ContactMessageResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [accepted]
    SubscriptionRequest:
      type: object
      additionalProperties: false
      required: [email, turnstileToken]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        website:
          type: string
          description: Hidden honeypot field. It must be left blank.
        turnstileToken:
          type: string
          description: Cloudflare Turnstile token verified server-side.
    SubscriptionResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [accepted]
    Job:
      type: object
      required:
        - id
        - fileName
        - fileSizeBytes
        - status
        - createdAt
      properties:
        id:
          type: string
          example: 1138660d531841f094944f9753b95a3a
        fileName:
          type: string
          example: rotor.stl
        fileSizeBytes:
          type: integer
          format: int64
          example: 117884
        fileFormat:
          type: string
          enum: [stl, 3mf]
          description: Trusted server-side format selected by the job endpoint.
        operation:
          type: string
          enum: [quality_check, safe_stl_repair, safe_3mf_repair]
        status:
          type: string
          enum:
            - created
            - processing
            - completed
            - failed
        createdAt:
          type: string
          format: date-time
        report:
          type: object
          description: Present when status is completed.
          additionalProperties: true
        failure:
          type: object
          description: Present when status is failed.
          additionalProperties: true
    CreateJobResponse:
      allOf:
        - $ref: "#/components/schemas/Job"
        - type: object
          required:
            - upload
          properties:
            upload:
              $ref: "#/components/schemas/Upload"
    Upload:
      type: object
      required:
        - url
        - method
        - fields
        - expiresAt
      properties:
        url:
          type: string
          format: uri
          description: Presigned S3 form action for uploading the STL file.
        method:
          type: string
          enum:
            - POST
        fields:
          type: object
          description: Fields that must be included before the file in the multipart form data.
          additionalProperties:
            type: string
        expiresAt:
          type: string
          format: date-time
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
    CodedErrorResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          enum: [FILE_TOO_LARGE, RATE_LIMITED, RATE_LIMIT_UNAVAILABLE]
        message:
          type: string
        retryAfterSeconds:
          type: integer
          minimum: 1
  responses:
    BadRequest:
      description: The request is invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalServerError:
      description: An unexpected error occurred.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
